<!DOCTYPE html>
<html>
<head>
    <title>Event Driven App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f0f8ff;
        }
        h1 {
            color: darkblue;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <h1>Node.js Event System ⚡</h1>

    <button onclick="triggerEvent('/login')">User Login</button>
    <button onclick="triggerEvent('/order')">Place Order</button>
    <button onclick="triggerEvent('/async')">Async Task</button>

    <p id="output"></p>

    <script>
        function triggerEvent(route) {
            fetch(route)
                .then(res => res.text())
                .then(data => {
                    document.getElementById("output").innerText = data;
                });
        }
    </script>

</body>
</html>
